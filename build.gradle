plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library' version '8.7.3' apply false
}

// Version is shared by both APKs so a release always ships a matched pair.
def bplayVersion = file('VERSION').text.trim()
def bplayVersionParts = bplayVersion.tokenize('.')

ext {
    // Derived so the code can never drift from the name; 1.2.3 -> 10203.
    bplayVersionCode = bplayVersionParts[0].toInteger() * 10000 +
            bplayVersionParts[1].toInteger() * 100 +
            bplayVersionParts[2].toInteger()
    bplayVersionName = bplayVersion
    bplayMinSdk = 22       // Fire OS 5 (Fire TV Stick 2nd gen) and up
    bplayTargetSdk = 34
    bplayCompileSdk = 34
    kotlinStdlibVersion = '1.8.22'
}

// AndroidX pulls in both kotlin-stdlib 1.8.x and the old split kotlin-stdlib-jdk7/jdk8 artifacts.
// Those were folded into kotlin-stdlib as of 1.8, so the two overlap and dexing fails on duplicate
// classes. Pinning the split artifacts to the same version makes Gradle collapse them.
subprojects {
    configurations.configureEach {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlinStdlibVersion"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinStdlibVersion"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinStdlibVersion"
        }
    }
}
