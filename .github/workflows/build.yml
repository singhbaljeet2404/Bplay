name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag to publish a release as, e.g. v1.0.0. Leave empty to only build.'
        required: false
        default: ''

# Needed so a tagged build can publish its APKs as a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # The browser sender and the Java receiver implement the wire format independently.
      # This fails the build if they have drifted apart.
      - name: Check wire-format conformance (JavaScript side)
        run: node tools/wire-check.js

      # The sender page is the only part of this a user reaches without installing anything, so
      # it gets loaded in a real browser -- including a simulated iPhone, where screen capture
      # does not exist and the page has to fall back to camera and files instead of dead-ending.
      - name: Browser test of the sender page
        run: |
          npm install --no-save --no-fund --no-audit playwright-core
          npx --yes playwright install chromium
          node tools/page-test.js

      - name: Unit tests
        run: ./gradlew :protocol:test --stacktrace

      # Lint is what catches calls to APIs newer than minSdk 22. Those compile cleanly against
      # API 34 and then crash on a Fire TV Stick, so this has to be blocking rather than a report.
      - name: Lint (API levels, permissions, manifest)
        run: ./gradlew :firetv-receiver:lintRelease :android-sender:lintRelease --stacktrace

      - name: Build APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp firetv-receiver/build/outputs/apk/release/firetv-receiver-release.apk \
             dist/bplay-firetv.apk
          cp android-sender/build/outputs/apk/release/android-sender-release.apk \
             dist/bplay-sender.apk
          ls -la dist

      - name: Verify the Fire TV APK is installable
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/bplay-firetv.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging dist/bplay-firetv.apk)
          echo "$BADGING" | grep -q "leanback-launchable-activity" \
            || { echo "::error::No leanback launcher; the app would not appear on the Fire TV home row"; exit 1; }
          # Any mandatory hardware feature would stop some Fire TV models installing it.
          if echo "$BADGING" | grep -E "^  uses-feature:"; then
            echo "::error::The APK requires hardware features; they must all be required=false"
            exit 1
          fi
          echo "$BADGING" | grep -E "sdkVersion|targetSdkVersion"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bplay-apks
          path: dist/*.apk
          if-no-files-found: error

      # Three ways a release gets published, all ending in the same place:
      #   - a pushed tag v*
      #   - a manual run with the tag named as an input
      #   - a push whose VERSION file names a release that does not exist yet
      # The last one exists because creating tags is not available to everyone who needs to cut
      # a release; the runner's own token has contents:write, so CI creates the tag itself.
      - name: Decide whether to publish
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_INPUT:-}" ]; then
            VERSION="$RELEASE_INPUT"
            REASON="requested by a manual run"
          elif case "$GITHUB_REF" in refs/tags/v*) true;; *) false;; esac; then
            VERSION="$GITHUB_REF_NAME"
            REASON="tag pushed"
          else
            VERSION="v$(tr -d ' \r\n' < VERSION)"
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "$VERSION is already published; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            REASON="VERSION names $VERSION, which has no release yet"
          fi
          echo "Publishing $VERSION ($REASON)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          # Recreate rather than fail when a release is re-cut after a fix.
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "BPlay Mirror $VERSION" \
            --notes-file .github/release-notes.md \
            dist/bplay-firetv.apk \
            dist/bplay-sender.apk
          echo "Published $VERSION"

      # Fetches the install URL the way a Fire TV does -- no credentials -- because that is the
      # only thing that actually proves Downloader can reach it. A release can publish perfectly
      # and still be unreachable: assets on a private repository are served only to authenticated
      # clients, so the link looks correct and 404s on the television with nothing to explain it.
      # Runs on every build, not just the one that cuts a release, so the state cannot go stale.
      - name: Check the install link is reachable without credentials
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/bplay-firetv.apk"
          if ! gh release list --limit 1 | grep -q .; then
            echo "No release published yet, so there is nothing for Downloader to fetch."
            exit 0
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 -L "$URL" || echo "000")
          echo "Unauthenticated GET $URL -> HTTP $CODE"
          if [ "$CODE" = "200" ] || [ "$CODE" = "206" ]; then
            echo "Install link is reachable. On the Fire TV, enter into Downloader:"
            echo "  $URL"
            exit 0
          fi
          PRIVATE=$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate 2>/dev/null || echo unknown)
          if [ "$PRIVATE" = "true" ]; then
            echo "::warning title=Install link unreachable: repository is private::The release is published, but GitHub serves its assets only to authenticated clients, and Downloader on a Fire TV is not one. Make the repository public under Settings -> General -> Change visibility. Nothing needs rebuilding."
          else
            echo "::warning title=Install link unreachable::$URL returned HTTP $CODE to an unauthenticated client. Check the release assets are named bplay-firetv.apk and bplay-sender.apk."
          fi
