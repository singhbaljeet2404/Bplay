name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag to publish a release as, e.g. v1.0.0. Leave empty to only build.'
        required: false
        default: ''

# Needed so a tagged build can publish its APKs as a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # The browser sender and the Java receiver implement the wire format independently.
      # This fails the build if they have drifted apart.
      - name: Check wire-format conformance (JavaScript side)
        run: node tools/wire-check.js

      - name: Unit tests
        run: ./gradlew :protocol:test --stacktrace

      # Lint is what catches calls to APIs newer than minSdk 22. Those compile cleanly against
      # API 34 and then crash on a Fire TV Stick, so this has to be blocking rather than a report.
      - name: Lint (API levels, permissions, manifest)
        run: ./gradlew :firetv-receiver:lintRelease :android-sender:lintRelease --stacktrace

      - name: Build APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp firetv-receiver/build/outputs/apk/release/firetv-receiver-release.apk \
             dist/bplay-firetv.apk
          cp android-sender/build/outputs/apk/release/android-sender-release.apk \
             dist/bplay-sender.apk
          ls -la dist

      - name: Verify the Fire TV APK is installable
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/bplay-firetv.apk
          BADGING=$("$BUILD_TOOLS/aapt" dump badging dist/bplay-firetv.apk)
          echo "$BADGING" | grep -q "leanback-launchable-activity" \
            || { echo "::error::No leanback launcher; the app would not appear on the Fire TV home row"; exit 1; }
          # Any mandatory hardware feature would stop some Fire TV models installing it.
          if echo "$BADGING" | grep -E "^  uses-feature:"; then
            echo "::error::The APK requires hardware features; they must all be required=false"
            exit 1
          fi
          echo "$BADGING" | grep -E "sdkVersion|targetSdkVersion"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bplay-apks
          path: dist/*.apk
          if-no-files-found: error

      # Publishes either from a pushed tag, or on demand with the tag named as an input --
      # the latter lets a release be cut without push access to tags.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE_INPUT" ]; then
            VERSION="$RELEASE_INPUT"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          echo "Publishing $VERSION from $GITHUB_SHA"
          # Recreate rather than fail when a release is re-cut after a fix.
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "BPlay Mirror $VERSION" \
            --notes-file .github/release-notes.md \
            dist/bplay-firetv.apk \
            dist/bplay-sender.apk
